name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir dist
          v="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/comma-$v-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/comma-$v-$abi.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned IPA (for AltStore / SideStore)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qr "comma-${GITHUB_REF_NAME}-unsigned.ipa" Payload && rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
